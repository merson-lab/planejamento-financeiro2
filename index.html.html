<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c7b">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Planejamento Financeiro Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f5;
  --card: #ffffff;
  --ink: #14202b;
  --mut: #5b6b79;
  --line: #d7dfe6;
  --c: #0e7c7b;
  --v: #3a5bd9;
  --ok: #1d7a3e;
  --bad: #b3261e;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c;
    --card: #18222b;
    --ink: #e8eef3;
    --mut: #93a4b3;
    --line: #2b3946;
    --c: #46c2c0;
    --v: #8aa2ff;
    --ok: #5fcf86;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --card: #18222b; --ink: #e8eef3; --mut: #93a4b3; --line: #2b3946;
  --c: #46c2c0; --v: #8aa2ff; --ok: #5fcf86; --bad: #ff8a80; color-scheme: dark;
}
.sync { font-size: 12px; color: var(--mut); text-align: center; margin: -6px 0 10px; min-height: 16px; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif;
  max-width: 520px;
  margin-inline: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(40px + env(safe-area-inset-bottom, 0px));
}
h1 { font-size: 22px; margin: 4px 0 12px; text-align: center; font-weight: 700; }
button, input, select { font: inherit; color: var(--ink); }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; }
.tabs button {
  flex: 1;
  padding: 10px 2px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.tabs button.on { background: var(--ink); color: var(--bg); }
.nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 18px; }
.nav button { width: 44px; height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 20px; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.cd small { color: var(--mut); display: block; font-size: 12px; }
.cd b { font-size: 19px; }
.big { background: var(--card); border: 2px solid var(--v); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.warn, .okb, .alert-box { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; border: 1px solid; line-height: 1.4; }
.warn { color: var(--bad); border-color: var(--bad); background: rgba(179,38,30,0.05); }
.okb { color: var(--ok); border-color: var(--ok); background: rgba(29,122,62,0.05); }
.alert-box { color: #d97706; border-color: #d97706; background: rgba(217,119,6,0.08); font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; width: 100%; text-align: left; cursor: pointer; }
.row.done { opacity: .55; }
.chk { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--mut); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; }
.done .chk { background: var(--ok); border-color: var(--ok); }
.grow { flex: 1; }
.grow small { color: var(--mut); display: block; font-size: 12px; }
.amt { font-weight: 700; }
.amt.in { color: var(--ok); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.card input, .card select, .fld input, .fld select { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 4px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
label { font-size: 13px; color: var(--mut); font-weight: 700; }
.add, .del { padding: 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); width: 100%; font-weight: 700; margin-top: 8px; cursor: pointer; }
.del { color: var(--bad); border-color: var(--bad); }
.wds { display: flex; gap: 5px; margin: 8px 0 14px; }
.wds button { flex: 1; padding: 10px 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-weight: 700; cursor: pointer; }
.wds button.on { background: var(--c); color: var(--bg); border-color: var(--c); }
.note { color: var(--mut); font-size: 13px; margin: 8px 2px; }
.row.hj { border: 2px solid var(--v); }
.rt { text-align: right; }
.rt small, .rt b { display: block; }
.row input { width: 96px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }

/* Estilos do Calendário Real */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
.cal-head { text-align: center; font-size: 12px; font-weight: 700; color: var(--mut); padding: 4px 0; }
.cal-day {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px;
  min-height: 58px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  text-align: left;
  position: relative;
  width: 100%;
}
.cal-day.empty { background: transparent; border: none; cursor: default; }
.cal-day.hj { border: 2px solid var(--v); }
.cal-day.sel { border: 2px solid var(--c); background: rgba(14,124,123,0.08); }
.cal-num { font-weight: 700; font-size: 12px; color: var(--ink); }
.cal-dots { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; width: 100%; }
.cal-badge { font-size: 9px; padding: 1px 3px; border-radius: 4px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.cal-badge.in { background: rgba(29,122,62,0.18); color: var(--ok); }
.cal-badge.out { background: rgba(179,38,30,0.18); color: var(--bad); }
.cal-badge.wk { background: rgba(58,91,217,0.18); color: var(--v); }

/* Permissão pra tirar da sobra */
.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.mini .mh { text-align: center; font-size: 11px; color: var(--mut); font-weight: 700; }
.mini button { padding: 10px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; }
.mini button.on { background: var(--c); border-color: var(--c); color: var(--bg); }
.mini button.pass { opacity: 0.4; }
.mini .bl { visibility: hidden; }
.bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 6px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
textarea { font: inherit; }
.perm { border-width: 2px; }
.perm .pb { display: flex; gap: 8px; }
.perm .pb button { flex: 1; padding: 11px 6px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--card); }
.perm .pb .yes { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.perm .pb .no { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<h1>Planejamento Completo</h1>
<div class="sync" id="sync"></div>
<div style="margin-bottom: 10px;"><button class="add" data-a="notif" id="btn-notif" style="margin-top:0;background:var(--card);color:var(--ink);">🔔 Avisar vencimentos quando eu abrir o app</button></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>

<script>
var LASTAV = [], KEY = "plano-v2",
    MS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
    WN = ["dom","seg","ter","qua","qui","sex","sáb"],
    tab = 1, selDay = 0,
    currentYM = new Date().getFullYear() + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2),
    S = {
      ym: currentYM,
      tipoRenda: "diaria",
      dia: 0,
      dias: [1,2,3,4,5],
      valQuinzena: 0,
      diaQ1: 5,
      diaQ2: 20,
      valMes: 0,
      diaMes: 5,
      ini: {},
      paid: {},
      gp: {},
      rp: {},
      carry: false,
      ex: [],
      bills: []
    };

try {
  var r = localStorage.getItem(KEY);
  if (r) S = JSON.parse(r);
} catch(e){}

function fix() {
  S.rp = S.rp || {}; S.au = S.au || {}; S.dw = S.dw || {}; S.real = S.real || {}; S.paid = S.paid || {}; S.gp = S.gp || {}; S.ini = S.ini || {}; S.rv = S.rv || {};
  if (!S.tipoRenda) S.tipoRenda = "diaria";
  if (S.dia === undefined) S.dia = 0;
  if (!S.dias) S.dias = [1,2,3,4,5];
  if (S.valQuinzena === undefined) S.valQuinzena = 0;
  if (S.diaQ1 === undefined) S.diaQ1 = 5;
  if (S.diaQ2 === undefined) S.diaQ2 = 20;
  if (S.valMes === undefined) S.valMes = 0;
  if (S.diaMes === undefined) S.diaMes = 5;
  S.carry = !!S.carry;
  S.bills = S.bills || [];
  S.ex = S.ex || [];
  S.bills.forEach(function(b){ if (!b.i) b.i = S.ym; if (!b.v) b.v = {}; });
  S.ex.forEach(function(x){ if (!x.i) x.i = S.ym; if (!x.v) x.v = {}; });
  if (!S.start) {
    var ms = [];
    S.bills.concat(S.ex).forEach(function(o){ if (o.i) ms.push(o.i); });
    S.start = ms.length ? ms.sort()[0] : S.ym;
  }
}
fix();
saveLocal();

// ---------- salvamento ----------
// Cópia no aparelho (localStorage) + cópia na sua conta (db do Artifact), que não some quando você fecha o app.
var CLOUD = { ref: null, saving: false, again: false, timer: null };
var KEY_PREV = "plano-v2-prev", BKMSG = "", PEND = null,
    STORE_OK = (function(){ try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })();
function localMsg() { return STORE_OK ? "💾 Salvo automaticamente neste aparelho" : "⚠️ Este navegador não guarda dados. Baixe um backup depois de cada uso."; }
function setSync(t) { var el = document.getElementById("sync"); if (el) el.textContent = t; }
function hora() { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function save() {
  S.ts = Date.now();
  saveLocal();
  if (CLOUD.ref) { clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 600); setSync("⏳ Salvando…"); }
}
function cloudPush() {
  if (!CLOUD.ref) return;
  if (CLOUD.saving) { CLOUD.again = true; return; }
  CLOUD.saving = true;
  var j = JSON.stringify(S), ts = S.ts || Date.now();
  CLOUD.ref.set({ json: j, ts: ts, v: 1 }).then(function(){
    CLOUD.saving = false;
    if (CLOUD.again) { CLOUD.again = false; cloudPush(); } else setSync("☁️ Salvo na sua conta às " + hora());
  }).catch(function(){
    CLOUD.saving = false;
    setSync("⚠️ Não consegui salvar na nuvem. Fica salvo só neste aparelho.");
  });
}
function temDados(o) { return (o.ts || 0) > 0 || (o.bills || []).length > 0 || (o.ex || []).length > 0 || (+o.dia || 0) > 0; }
async function cloudInit() {
  try {
    if (!window.claude || !window.claude.use) { setSync(localMsg()); return; }
    setSync("⏳ Conectando à sua conta…");
    var cl = await window.claude.use("db"), us = await window.claude.use("user");
    if (!cl || !us) { setSync("💾 Salvo só neste aparelho (nuvem indisponível)"); return; }
    var uid = await us.id();
    if (!uid) { setSync("💾 Salvo só neste aparelho (entre na sua conta pra salvar na nuvem)"); return; }
    var ref = cl.doc("data/users/" + uid + "/plano"), snap = await ref.get(), rem = null;
    if (snap.exists) {
      var dd = snap.data() || {};
      try { rem = JSON.parse(dd.json); if (rem) rem.ts = dd.ts || rem.ts || 0; } catch(e1){ rem = null; }
    }
    CLOUD.ref = ref;
    if (rem && rem.bills && rem.ym && (rem.ts || 0) > (S.ts || 0)) {
      S = rem; fix(); START = S.start; CC = {}; MC = {}; saveLocal(); draw();
      setSync("☁️ Dados carregados da sua conta");
    } else if (temDados(S) && (!rem || (S.ts || 0) > (rem.ts || 0))) {
      if (!S.ts) S.ts = Date.now();
      saveLocal(); cloudPush();
    } else setSync("☁️ Conectado à sua conta");
  } catch(e) { setSync("💾 Salvo só neste aparelho (nuvem indisponível)"); }
}

// dia de diária de verdade: segue os dias da semana, mas respeita o que você marcou no calendário da aba Renda
// S.dw[dia] = "n" (faltei) ou "y" (diária extra fora dos dias de sempre)
function onList(on) { var r = [], i; for (i = 1; i < on.length; i++) if (on[i]) r.push(i); return r; }
// quais dias do mês uma conta semanal/diária cobra, quanto em cada dia e o que ainda falta (semanas que já passaram ficam de fora)
function billPlan(b, ym, dias, tmd) {
  var pq = ym.split("-"), Y = +pq[0], M = +pq[1], N = new Date(Y, M, 0).getDate(), fdw = new Date(Y, M-1, 1).getDay(),
      cu = (b.dm || {})[ym], custom = !!cu, sel = [], on = [], live = [], per = [], q, wkc = {}, tw = 0, cnt = 0, wl = {}, nk;
  if (cu) cu.forEach(function(d){ if (d >= 1 && d <= N) on[d] = true; });
  else {
    sel = b.t === "s" ? ((b.wd && b.wd.length) ? b.wd : dias) : (b.wd || [1,2,3,4,5]);
    for (q = 1; q <= N; q++) if (sel.indexOf(new Date(Y, M-1, q).getDay()) >= 0) on[q] = true;
  }
  for (q = 1; q <= N; q++) if (on[q]) { nk = Math.floor((q - 1 + fdw) / 7); wkc[nk] = (wkc[nk] || 0) + 1; }
  for (q = 1; q <= N; q++) {
    if (!on[q]) continue;
    nk = Math.floor((q - 1 + fdw) / 7);
    if (b.t === "s") per[q] = custom ? b.a / wkc[nk] : b.a / (sel.length || 1);
    else per[q] = b.a;
    if (b.t === "s" && tmd && q < tmd) continue; // semana que já passou: ignora
    live[q] = true; cnt++; tw += per[q]; wl[nk] = 1;
  }
  return { on: on, live: live, per: per, sel: sel, custom: custom, cnt: cnt, tw: tw, wl: Object.keys(wl).length };
}
function selNames(sel) {
  return [1,2,3,4,5,6,0].filter(function(i){ return sel.indexOf(i) >= 0; }).map(function(i){ return WN[i]; }).join(", ");
}
function wdOn(d) {
  var p = S.ym.split("-"), pat = ic("dias").indexOf(new Date(+p[0], +p[1]-1, d).getDay()) >= 0;
  if (ic("tipoRenda") !== "diaria") return pat;
  var o = (S.dw || {})[S.ym + "d" + d];
  return o === "n" ? false : (o === "y" ? true : pat);
}
function F(n) { return (n || 0).toFixed(2).replace(".",",").replace(/,00$/,""); }
function R(n) { return "R$ " + F(n); }
function inp(sc, id, f, v, ty) {
  return '<input data-s="'+sc+'" data-i="'+id+'" data-f="'+f+'" type="'+ty+'" value="'+String(v).replace(/"/g,"&quot;")+'"'+(ty=="number"?' step="0.01" inputmode="decimal"':'')+'>';
}

var START = S.start;
var CC = {}, MC = {};
function ymKeys(o) { return Object.keys(o || {}).sort(); }
function ic(f) {
  var v = S[f];
  ymKeys(S.rv).forEach(function(k){ if (k <= S.ym && S.rv[k][f] !== undefined) v = S.rv[k][f]; });
  return v;
}
function setC(f, v) { S.rv = S.rv || {}; S.rv[S.ym] = S.rv[S.ym] || {}; S.rv[S.ym][f] = v; }
function eff(o, m) {
  var r = {}, k;
  for (k in o) if (k !== "v") r[k] = o[k];
  ymKeys(o.v).forEach(function(y){ if (y <= m) { var u = o.v[y], kk; for (kk in u) r[kk] = u[kk]; } });
  return r;
}
function act(o, m) { return (!o.i || m >= o.i) && (!o.f || m <= o.f); }
function mNome(ym) { var p = ym.split("-"); return MS[+p[1]-1] + " de " + p[0]; }
function navH() { return '<div class="nav"><button data-a="pm">‹</button><b>' + mNome(S.ym) + '</b><button data-a="nm">›</button></div>'; }
function prevYM(ym) {
  var p = ym.split("-"), d = new Date(+p[0], +p[1]-2, 1);
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
}
function carry(ym) {
  if (ym <= START) return { p: 0, m: 0 };
  if (CC[ym]) return CC[ym];
  var o = S.ym; S.ym = prevYM(ym);
  var s = serie(), l = s[s.length-1];
  S.ym = o;
  return (CC[ym] = { p: l.pote, m: l.mim });
}

function XS() { return S.ex.filter(function(x){ return act(x, S.ym); }).map(function(x){ return eff(x, S.ym); }); }
function XT() { return XS().filter(function(x){ return S.rp[S.ym] || !x.i || x.i == S.ym; }); }
function ini0() { return ic("carry") ? carry(S.ym).p : (+S.ini[S.ym] || 0); }
function mim0() { return ic("carry") ? carry(S.ym).m : Math.max(0, mao(S.ym) - ini0()); }

function calc() {
  var p = S.ym.split("-"), Y = +p[0], M = +p[1], N = new Date(Y, M, 0).getDate(), wd = [], w = 0, wdp = [], wP = 0, d,
      dias = ic("dias"), tipo = ic("tipoRenda"), dia = +ic("dia") || 0;
  for (d = 1; d <= N; d++) {
    var k = wdOn(d), kp = dias.indexOf(new Date(Y, M-1, d).getDay()) >= 0;
    wd[d] = k; if (k) w++;
    wdp[d] = kp; if (kp) wP++;
  }
  var X = XS(),
      L = S.bills.filter(function(b){ return act(b, S.ym); }).map(function(b){ return eff(b, S.ym); }),
      ex = X.reduce(function(s, x){ return s + x.a; }, 0),
      wk = dias.length || 1, tot = 0, ud = 0, wc = [], hasWC = false;
  var dc = [], hasDC = false;
  for (d = 1; d <= N; d++) { dc[d] = 0; wc[d] = 0; }
  var tnw = new Date(), tmd = (tnw.getFullYear() == Y && tnw.getMonth() + 1 == M) ? tnw.getDate() : 0;
  L.forEach(function(b){
    if (b.t == "dd" || b.t == "s") {
      var pl = billPlan(b, S.ym, dias, tmd), q;
      b.on = pl.on; b.live = pl.live; b.per = pl.per; b.sel = pl.sel; b.custom = pl.custom; b.cnt = pl.cnt; b.wl = pl.wl;
      if (b.t == "dd") { for (q = 1; q <= N; q++) if (pl.live[q]) { dc[q] += b.a; hasDC = true; } b.tt = pl.tw; tot += b.tt; }
      else { for (q = 1; q <= N; q++) if (pl.live[q]) { wc[q] += pl.per[q]; hasWC = true; } b.tw = pl.tw; tot += b.tw; ud += pl.tw; }
    }
    else tot += b.a;
  });

  var principalRendaTotal = 0;
  if (tipo === "diaria") principalRendaTotal = dia * w;
  else if (tipo === "quinzena") principalRendaTotal = ic("valQuinzena") * 2;
  else if (tipo === "mes") principalRendaTotal = ic("valMes");

  // entradas "de uma vez" (quinzena / mês)
  var lumps = [];
  if (tipo === "quinzena") {
    lumps.push({ d: Math.min(ic("diaQ1"), N), amt: ic("valQuinzena"), id: "q1" });
    lumps.push({ d: Math.min(ic("diaQ2"), N), amt: ic("valQuinzena"), id: "q2" });
  } else if (tipo === "mes") lumps.push({ d: Math.min(ic("diaMes"), N), amt: ic("valMes"), id: "mes1" });

  // adaptação: no mês de hoje, dias que já passaram e você não marcou como recebidos não entram no plano
  var td = new Date(), t0 = (td.getFullYear() == Y && td.getMonth() + 1 == M) ? td.getDate() : 0,
      miss = [], missN = 0;
  if (t0) {
    for (d = 1; d < t0; d++) if (tipo === "diaria" && wd[d] && !S.paid[S.ym + "d" + d]) { miss[d] = true; missN++; }
    lumps.forEach(function(e){ if (e.d < t0 && !S.paid[S.ym + e.id]) { e.miss = true; missN++; } });
  }
  var lumpDays = {};
  lumps.forEach(function(e){ if (!e.miss && e.amt > 0) { var o = lumpDays[e.d] || (lumpDays[e.d] = { d: e.d, amt: 0, ids: [] }); o.amt += e.amt; o.ids.push(e.id); } });
  var lumpList = Object.keys(lumpDays).map(function(k){ return lumpDays[k]; }).sort(function(a, b){ return a.d - b.d; });

}

async function bkSave() {
  var txt = bkPayload(), name = bkName(), feito = false;
  try {
    if (window.claude && window.claude.use) {
      var dl = await window.claude.use("downloads");

    }
  } catch(e) {

  }

    try {
      var blob = new Blob([txt], { type: "application/json" }), url = URL.createObjectURL(blob), an = document.createElement("a");
      an.href = url; an.download = name; document.body.appendChild(an); an.click();

}

}

// lê o texto de um backup e confere se faz sentido, sem mexer nos dados atuais
function bkParse(text) {
  var o;
  try { o = JSON.parse(text); } catch(e) { return { err: "Esse arquivo não parece ser um backup (não consegui ler)." }; }
  var d = (o && o.app === "planejamento-financeiro" && o.data) ? o.data : o;
  if (!d || typeof d !== "object" || !Array.isArray(d.bills) || typeof d.ym !== "string" || !/^\d{4}-\d{2}$/.test(d.ym))
    return { err: "Esse arquivo não é um backup deste app." };
  var meses = {};
  Object.keys(d.paid || {}).forEach(function(k){ meses[k.slice(0, 7)] = 1; });
  return { S: d, info: { contas: d.bills.length, rendas: (d.ex || []).length, meses: Object.keys(meses).length, quando: (o && o.exportedAt) || "" } };
}
function bkStage(text) {
  var r = bkParse(text);
  if (r.err) { PEND = null; BKMSG = r.err; } else { PEND = r; BKMSG = ""; }
}
function bkApply() {
  if (!PEND) return;
  var antes = JSON.stringify(S);
  try {
    S = PEND.S; fix(); START = S.start; CC = {}; MC = {}; calc();
  } catch(e) {
    S = JSON.parse(antes); fix(); START = S.start; CC = {}; MC = {};
    PEND = null; BKMSG = "Esse backup tem algo errado e não foi carregado. Seus dados continuam como estavam."; return;
  }
  try { localStorage.setItem(KEY_PREV, antes); } catch(e2) {}
  PEND = null; BKMSG = "✅ Backup carregado. Se não era isso, use \"Desfazer\".";
}
function bkUndo() {
  var p = null;
  try { p = JSON.parse(localStorage.getItem(KEY_PREV) || "null"); } catch(e) {}
  if (!p || !p.bills) { BKMSG = "Não tem nada pra desfazer."; return; }
  S = p; fix(); START = S.start; CC = {}; MC = {};

  BKMSG = "↩️ Voltei pros dados de antes do backup.";
}

document.addEventListener("change", function(e){

    rd.onload = function(){ bkStage(String(rd.result || "")); draw(); };
    rd.onerror = function(){ BKMSG = "Não consegui ler esse arquivo."; draw(); };
    rd.readAsText(fl); t.value = ""; return;
  }
  var sc = t.dataset.s; if (!sc) return;
  var f = t.dataset.f, v = t.value;
  if (sc == "g") { S.gp = S.gp || {}; S.gp[S.ym + "d" + t.dataset.i] = parseFloat(v) || 0; }
  else if (sc == "r") {
    S.real = S.real || {};
    var rr = S.real[S.ym] || (S.real[S.ym] = { d: 1, pote: null, mim: null });
    rr.d = new Date().getDate();
    if (f == "pote") rr.pote = v === "" ? null : (parseFloat(v) || 0);
    else rr.mim = v === "" ? null : (parseFloat(v) || 0);
    if (rr.pote === null && rr.mim === null) delete S.real[S.ym];
  }
  else if (sc == "c") {
    if (f == "tipoRenda") setC("tipoRenda", v);
    else if (f == "ini") S.ini[S.ym] = parseFloat(v) || 0;
    else if (f == "dia") setC("dia", parseFloat(v) || 0);
    else if (f == "valQuinzena") setC("valQuinzena", parseFloat(v) || 0);
    else if (f == "diaQ1") setC("diaQ1", parseInt(v) || 1);
    else if (f == "diaQ2") setC("diaQ2", parseInt(v) || 15);
    else if (f == "valMes") setC("valMes", parseFloat(v) || 0);
    else if (f == "diaMes") setC("diaMes", parseInt(v) || 5);
  }
  else {
    var o = (sc == "b" ? S.bills : S.ex).filter(function(x){ return x.id == t.dataset.i; })[0];
    if (o) {
      if (f == "f") { if (v && v < S.ym) v = S.ym; o.f = v; }
      else {
        o.v = o.v || {}; o.v[S.ym] = o.v[S.ym] || {};
        o.v[S.ym][f] = (f == "a" || f == "d") ? (parseFloat(v) || 0) : v;
      }
    }
  }
  save(); draw();
});

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-a]"); if (!t) return;
  var a = t.dataset.a, i = t.dataset.i;
  if (a == "tab") tab = +i;
  else if (a == "pm" || a == "nm") {
    var p = S.ym.split("-"), d = new Date(+p[0], +p[1] - 1 + (a == "nm" ? 1 : -1), 1);
    S.ym = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
    selDay = 1;
  }
  else if (a == "selday") selDay = +i;
  else if (a == "tog") { var k = S.ym + i; S.paid[k] = !S.paid[k]; }
  else if (a == "wd") { var cur = ic("dias").slice(), x = cur.indexOf(+i); if (x < 0) cur.push(+i); else cur.splice(x, 1); setC("dias", cur); }
  else if (a == "rep") S.rp[S.ym] = !S.rp[S.ym];
  else if (a == "rclr") { delete (S.real || {})[S.ym]; }
  else if (a == "bkgen") { var bk = document.getElementById("bk"); if (bk) { bk.value = JSON.stringify(S); bk.focus(); bk.select(); try { document.execCommand("copy"); } catch(e2){} } return; }
  else if (a == "bkrst") { var bt2 = document.getElementById("bk"); bkStage(bt2 ? bt2.value : ""); }
  else if (a == "bkfile") { bkSave(); return; }
  else if (a == "bkshare") { bkShare(); return; }
  else if (a == "bkok") bkApply();
  else if (a == "bkno") { PEND = null; BKMSG = ""; }
  else if (a == "bkundo") bkUndo();
  else if (a == "bksoneca") S.bkSnooze = Date.now();
  else if (a == "wkd") {
    S.dw = S.dw || {};
    var wk = S.ym + "d" + i, ws = wkState(+i), wp = S.ym.split("-"), wpat = ic("dias").indexOf(new Date(+wp[0], +wp[1]-1, +i).getDay()) >= 0;
    if (wpat) {
      if (ws === "n") { delete S.dw[wk]; delete S.paid[wk]; }
      else if (ws === "y") { S.dw[wk] = "n"; delete S.paid[wk]; }
      else S.paid[wk] = true;
    } else {
      if (ws === "off") { S.dw[wk] = "y"; S.paid[wk] = true; }
      else { delete S.dw[wk]; delete S.paid[wk]; }
    }
  }
  else if (a == "wkall") {
    var tdy = new Date(), wq;
    for (wq = 1; wq <= tdy.getDate(); wq++) if (wkState(wq) === "p") S.paid[S.ym + "d" + wq] = true;
  }
  else if (a == "au") { S.au = S.au || {}; var ak = S.ym + "d" + i; if (t.dataset.v) S.au[ak] = t.dataset.v; else delete S.au[ak]; }
  else if (a == "auall") { S.au = S.au || {}; (t.dataset.l || "").split(",").forEach(function(dd){ if (dd) S.au[S.ym + "d" + dd] = "y"; }); }
  else if (a == "carry") setC("carry", !ic("carry"));
  else if (a == "bdt") {
    var bo3 = S.bills.filter(function(z){ return z.id == i; })[0];
    if (bo3) {
      var e3 = eff(bo3, S.ym), lst = onList(billPlan(e3, S.ym, ic("dias"), 0).on), dn = +t.dataset.w, ix = lst.indexOf(dn);
      if (ix < 0) lst.push(dn); else if (!(e3.t === "s" && lst.length === 1)) lst.splice(ix, 1);
      lst.sort(function(x, y){ return x - y; });
      bo3.dm = bo3.dm || {}; bo3.dm[S.ym] = lst;
    }
  }
  else if (a == "bdtclr") {
    var bo4 = S.bills.filter(function(z){ return z.id == i; })[0];
    if (bo4 && bo4.dm) delete bo4.dm[S.ym];
  }
  else if (a == "bwd") {
    var bo = S.bills.filter(function(z){ return z.id == i; })[0];
    if (bo) {
      var bo2 = eff(bo, S.ym),
          cur2 = (bo2.t === "s" ? ((bo2.wd && bo2.wd.length) ? bo2.wd : ic("dias")) : (bo2.wd || [1,2,3,4,5])).slice(),
          w3 = +t.dataset.w, x3 = cur2.indexOf(w3);
      if (x3 < 0) cur2.push(w3); else if (!(bo2.t === "s" && cur2.length === 1)) cur2.splice(x3, 1);
      if (bo.dm) delete bo.dm[S.ym];
      bo.v = bo.v || {}; bo.v[S.ym] = bo.v[S.ym] || {}; bo.v[S.ym].wd = cur2;
    }
  }
  else if (a == "notif") {
    if (window.Notification) {
      Notification.requestPermission().then(function(perm){
        if (perm === "granted") {
          new Notification("Planejamento Financeiro", { body: "Lembretes ativados com sucesso!" });
          draw();
        } else {
          alert("Permissão de notificação negada pelo navegador.");
        }
      });
    } else {
      alert("Este navegador não suporta notificações.");
    }
  }
  else if (a == "addb") S.bills.push({ id: "b" + Date.now(), n: "Nova conta", a: 0, d: 1, t: "m", i: S.ym, f: "", v: {} });
  else if (a == "addx") S.ex.push({ id: "x" + Date.now(), n: "Nova renda", a: 0, d: 1, i: S.ym, f: "", v: {} });
  else if (a == "delb" || a == "delx") {
    var key = a == "delb" ? "bills" : "ex", o = S[key].filter(function(z){ return z.id == i; })[0];
    if (o) {
      if (!o.i || o.i >= S.ym) S[key] = S[key].filter(function(z){ return z.id != i; });
      else o.f = prevYM(S.ym);
    }
  }
  save(); draw();
});
