<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c7b">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Planejamento Financeiro Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #eef2f5;
  --card: #ffffff;
  --ink: #14202b;
  --mut: #5b6b79;
  --line: #d7dfe6;
  --c: #0e7c7b;
  --v: #3a5bd9;
  --ok: #1d7a3e;
  --bad: #b3261e;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c;
    --card: #18222b;
    --ink: #e8eef3;
    --mut: #93a4b3;
    --line: #2b3946;
    --c: #46c2c0;
    --v: #8aa2ff;
    --ok: #5fcf86;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
.sync { font-size: 12px; color: var(--mut); text-align: center; margin: -6px 0 10px; min-height: 16px; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif;
  max-width: 520px;
  margin-inline: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(40px + env(safe-area-inset-bottom, 0px));
}
h1 { font-size: 22px; margin: 4px 0 12px; text-align: center; font-weight: 700; }
button, input, select { font: inherit; color: var(--ink); }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; }
.tabs button {
  flex: 1;
  padding: 10px 2px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.tabs button.on { background: var(--ink); color: var(--bg); }
.nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 18px; }
.nav button { width: 44px; height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 20px; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.cd small { color: var(--mut); display: block; font-size: 12px; }
.cd b { font-size: 19px; }
.big { background: var(--card); border: 2px solid var(--v); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.warn, .okb, .alert-box { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; border: 1px solid; line-height: 1.4; }
.warn { color: var(--bad); border-color: var(--bad); background: rgba(179,38,30,0.05); }
.okb { color: var(--ok); border-color: var(--ok); background: rgba(29,122,62,0.05); }
.alert-box { color: #d97706; border-color: #d97706; background: rgba(217,119,6,0.08); font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; width: 100%; text-align: left; cursor: pointer; }
.row.done { opacity: .55; }
.chk { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--mut); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; }
.done .chk { background: var(--ok); border-color: var(--ok); }
.grow { flex: 1; }
.grow small { color: var(--mut); display: block; font-size: 12px; }
.amt { font-weight: 700; }
.amt.in { color: var(--ok); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.card input, .card select, .fld input, .fld select { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 4px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
label { font-size: 13px; color: var(--mut); font-weight: 700; }
.add, .del { padding: 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); width: 100%; font-weight: 700; margin-top: 8px; cursor: pointer; }
.del { color: var(--bad); border-color: var(--bad); }
.wds { display: flex; gap: 5px; margin: 8px 0 14px; }
.wds button { flex: 1; padding: 10px 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-weight: 700; cursor: pointer; }
.wds button.on { background: var(--c); color: var(--bg); border-color: var(--c); }
.note { color: var(--mut); font-size: 13px; margin: 8px 2px; }
.row.hj { border: 2px solid var(--v); }
.rt { text-align: right; }
.rt small, .rt b { display: block; }
.row input { width: 96px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }

/* Calendário */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
.cal-head { text-align: center; font-size: 12px; font-weight: 700; color: var(--mut); padding: 4px 0; }
.cal-day { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-height: 58px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; text-align: left; position: relative; width: 100%; }
.cal-day.empty { background: transparent; border: none; cursor: default; }
.cal-day.hj { border: 2px solid var(--v); }
.cal-day.sel { border: 2px solid var(--c); background: rgba(14,124,123,0.08); }
.cal-num { font-weight: 700; font-size: 12px; color: var(--ink); }
.cal-dots { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; width: 100%; }
.cal-badge { font-size: 9px; padding: 1px 3px; border-radius: 4px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.cal-badge.in { background: rgba(29,122,62,0.18); color: var(--ok); }
.cal-badge.out { background: rgba(179,38,30,0.18); color: var(--bad); }
.cal-badge.wk { background: rgba(58,91,217,0.18); color: var(--v); }

.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.mini .mh { text-align: center; font-size: 11px; color: var(--mut); font-weight: 700; }
.mini button { padding: 8px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; }
.mini button.on { background: var(--c); border-color: var(--c); color: var(--bg); }
.mini button.pass { opacity: 0.4; }
.mini .bl { visibility: hidden; }

.bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 6px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
textarea { font: inherit; }
.row.sm { padding: 8px 10px; margin-bottom: 6px; }
.mk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 12px; }
.mk .mh { text-align: center; font-size: 11px; font-weight: 700; color: var(--mut); }
.mk button, .mk .off { min-height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 0; }
.mk button { cursor: pointer; }
.mk button small { font-size: 13px; min-height: 14px; }
.mk button.on { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.mk button.hj { box-shadow: 0 0 0 2px var(--v); }
.mk .off { opacity: .3; background: transparent; border-style: dashed; }
.perm { border-width: 2px; }
.perm .pb { display: flex; gap: 8px; }
.perm .pb button { flex: 1; padding: 11px 6px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--card); }
.perm .pb .yes { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.perm .pb .no { color: var(--bad); border-color: var(--bad); }

/* Login */
#auth-screen { --brand: #1f716a; --brand-d: #195c56; min-height: 100vh; padding: 28px 0 40px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #auth-screen { --brand: #46c2c0; --brand-d: #38a8a6; } }
.au-card { background: var(--card); border-radius: 24px; padding: 34px 26px 30px; box-shadow: 0 10px 40px rgba(20,32,43,0.08); border: 1px solid var(--line); }
.au-logo { display: block; margin: 0 auto 18px; width: 64px; height: 64px; }
.au-card h2 { text-align: center; font-size: 30px; line-height: 1.15; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.5px; }
.au-sub { text-align: center; color: var(--mut); font-size: 17px; margin: 0 0 28px; }
.au-card label { display: block; font-size: 15px; color: var(--ink); font-weight: 700; margin: 0 0 8px 2px; }
.au-field { position: relative; margin-bottom: 18px; }
.au-field input { width: 100%; height: 52px; padding: 0 46px 0 48px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 16px; margin: 0; }
.au-field input:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
.au-field .ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--mut); pointer-events: none; }
.au-field .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: transparent; color: var(--mut); cursor: pointer; display: grid; place-items: center; padding: 0; }
.au-field .eye svg { width: 22px; height: 22px; }
.au-forgot { text-align: right; margin: -6px 0 18px; }
.au-forgot button { border: 0; background: transparent; color: var(--brand); font-weight: 700; font-size: 15px; cursor: pointer; padding: 4px 0; }
.au-main { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.au-main:active { background: var(--brand-d); }
.au-main:disabled, .au-google:disabled { opacity: .6; cursor: default; }
.au-main svg { width: 22px; height: 22px; }
.au-or { display: flex; align-items: center; gap: 14px; color: var(--mut); font-size: 14px; margin: 24px 0; }
.au-or::before, .au-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.au-google { width: 100%; height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; }
.au-google svg { width: 24px; height: 24px; }
.au-msg { text-align: center; font-size: 14px; min-height: 18px; margin: 14px 0 0; color: var(--bad); }
.au-msg.ok { color: var(--ok); }
.au-switch { text-align: center; color: var(--mut); font-size: 16px; margin: 22px 0 0; }
.au-switch button { border: 0; background: transparent; color: var(--brand); font-weight: 800; font-size: 16px; cursor: pointer; padding: 0; }
</style>
</head>
<body>

<!-- TELA DE LOGIN / CRIAR CONTA -->
<div id="auth-screen" style="display:none;">
  <div class="au-card">
    <svg class="au-logo" viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-35 32 32)"><rect x="5" y="15" width="40" height="15" rx="7.5" fill="#1d6b63"/><rect x="19" y="34" width="40" height="15" rx="7.5" fill="#3fa79b"/></g></svg>
    <h2 id="auth-title">Bem-vindo de volta</h2>
    <p class="au-sub" id="auth-sub">Entre para continuar</p>

    <label for="auth-email">E-mail</label>
    <div class="au-field">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
      <input type="email" id="auth-email" placeholder="voce@email.com" autocomplete="email" inputmode="email" autocapitalize="none">
    </div>

    <label for="auth-pass">Senha</label>
    <div class="au-field">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
      <input type="password" id="auth-pass" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="eye" id="auth-eye" aria-label="Mostrar senha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="au-forgot" id="auth-forgot-wrap"><button type="button" id="auth-forgot">Esqueceu a senha?</button></div>

    <button type="button" class="au-main" id="auth-btn"><span id="auth-btn-t">Entrar na conta</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div class="au-or">ou continue com</div>

    <button type="button" class="au-google" id="auth-google">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar com Google
    </button>

    <div class="au-msg" id="auth-msg"></div>

    <p class="au-switch"><span id="auth-switch-t">Ainda não tem conta?</span> <button type="button" id="auth-switch">Criar conta</button></p>
  </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app-screen" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <h1>Planejamento Completo</h1>
    <button id="logout-btn" style="font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer;">Sair da Conta</button>
  </div>
  <div class="sync" id="sync"></div>
  <div style="margin-bottom: 10px;"><button class="add" data-a="notif" id="btn-notif" style="margin-top:0;background:var(--card);color:var(--ink);">🔔 Avisar vencimentos quando eu abrir o app</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO DO FIREBASE
// ==========================================
var firebaseConfig = {
  apiKey: "AIzaSyC5i5n9bMtr--hj_mw0km1RGiGWLXwPTQU",
  authDomain: "finaceiro-f268b.firebaseapp.com",
  projectId: "finaceiro-f268b",
  storageBucket: "finaceiro-f268b.firebasestorage.app",
  messagingSenderId: "425198285823",
  appId: "1:425198285823:web:34162e9c00afc1be5a6dca"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var currentUserUid = null;
var unsubscribeSync = null;

// ==========================================
// ESTADO E UTILITÁRIOS
// ==========================================
var LASTAV = [],
    MS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
    WN = ["dom","seg","ter","qua","qui","sex","sáb"],
    tab = 1, selDay = 0, VOPEN = false,
    currentYM = new Date().getFullYear() + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2),
    S = createEmptyState();

function createEmptyState() {
  return {
    ym: currentYM, tipoRenda: "diaria", dia: 0, dias: [1,2,3,4,5],
    valQuinzena: 0, diaQ1: 5, diaQ2: 20, valMes: 0, diaMes: 5,
    ini: {}, paid: {}, gp: {}, rp: {}, carry: false, ex: [], bills: [],
    start: currentYM, ts: Date.now()
  };
}

function getKey() {
  return currentUserUid ? ("plano-v2-" + currentUserUid) : "plano-v2-guest";
}

function fix() {
  S.rp = S.rp || {}; S.au = S.au || {}; S.dw = S.dw || {}; S.real = S.real || {}; S.paid = S.paid || {}; S.gp = S.gp || {}; S.ini = S.ini || {}; S.rv = S.rv || {}; S.bdw = S.bdw || {};
  if (!S.tipoRenda) S.tipoRenda = "diaria";
  if (S.dia === undefined) S.dia = 0;
  if (!S.dias) S.dias = [1,2,3,4,5];
  if (S.valQuinzena === undefined) S.valQuinzena = 0;
  if (S.diaQ1 === undefined) S.diaQ1 = 5;
  if (S.diaQ2 === undefined) S.diaQ2 = 20;
  if (S.valMes === undefined) S.valMes = 0;
  if (S.diaMes === undefined) S.diaMes = 5;
  S.carry = !!S.carry;
  S.bills = S.bills || [];
  S.ex = S.ex || [];
  S.bills.forEach(function(b){ if (!b.i) b.i = S.ym; if (!b.v) b.v = {}; });
  S.ex.forEach(function(x){ if (!x.i) x.i = S.ym; if (!x.v) x.v = {}; });
  if (!S.start) {
    var ms = [];
    S.bills.concat(S.ex).forEach(function(o){ if (o.i) ms.push(o.i); });
    S.start = ms.length ? ms.sort()[0] : S.ym;
  }
}

var CLOUD = { saving: false, again: false, timer: null };
function setSync(t) { var el = document.getElementById("sync"); if (el) el.textContent = t; }
function hora() { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }

function saveLocal() { 
  try { localStorage.setItem(getKey(), JSON.stringify(S)); } catch(e){} 
}

function save() {
  S.ts = Date.now();
  saveLocal();
  if (currentUserUid) {
    clearTimeout(CLOUD.timer);
    CLOUD.timer = setTimeout(cloudPush, 600);
    setSync("⏳ Salvando na nuvem…");
  }
}

function cloudPush() {
  if (!currentUserUid) return;
  if (CLOUD.saving) { CLOUD.again = true; return; }
  CLOUD.saving = true;
  var j = JSON.stringify(S), ts = S.ts || Date.now();
  db.collection("users").doc(currentUserUid).set({ json: j, ts: ts }).then(function(){
    CLOUD.saving = false;
    if (CLOUD.again) { CLOUD.again = false; cloudPush(); } else setSync("☁️ Sincronizado com a nuvem às " + hora());
  }).catch(function(err){
    CLOUD.saving = false;
    setSync("⚠️ Erro ao salvar na nuvem: " + err.message);
  });
}

function listenCloud(uid) {
  if (unsubscribeSync) unsubscribeSync();
  setSync("⏳ Carregando seus dados…");
  
  var localData = null;
  try { localData = localStorage.getItem(getKey()); } catch(e){}
  if (localData) {
    try { S = JSON.parse(localData); fix(); } catch(e){}
  } else {
    S = createEmptyState(); fix();
  }

  unsubscribeSync = db.collection("users").doc(uid).onSnapshot(function(doc){
    if (doc.exists) {
      var data = doc.data();
      try {
        var rem = JSON.parse(data.json);
        if (rem) {
          S = rem; fix(); CC = {}; MC = {}; saveLocal(); draw();
          setSync("☁️ Dados atualizados da nuvem às " + hora());
        }
      } catch(e){ draw(); }
    } else {
      cloudPush();
      draw();
    }
  }, function(err){
    setSync("⚠️ Modo offline: usando dados locais");
    draw();
  });
}

auth.onAuthStateChanged(function(user) {
  if (user) {
    currentUserUid = user.uid;
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "block";
    listenCloud(user.uid);
  } else {
    currentUserUid = null;
    if (unsubscribeSync) { unsubscribeSync(); unsubscribeSync = null; }
    S = createEmptyState();
    document.getElementById("auth-screen").style.display = "block";
    document.getElementById("app-screen").style.display = "none";
  }

      h = '<div class="nav"><button data-a="pm">‹</button><b>' + MS[c.M-1] + ' de ' + c.Y + '</b><button data-a="nm">›</button></div>';
  
  h += '<button class="add" data-a="tab" data-i="2" style="margin:0 0 12px;background:var(--c);color:var(--bg);border-color:var(--c)">✅ Marcar diárias e pagamentos →</button>';
  var td = new Date();
  var isCurrentMonth = td.getFullYear() == c.Y && (td.getMonth() + 1) == c.M;
  if (isCurrentMonth) {
    var hojeD = td.getDate();
    var avisosHoje = [];
    c.L.forEach(function(b){
      if (b.t === "dd") { 
        if (b.on[hojeD] && !S.paid[S.ym + b.id + "d" + hojeD]) avisosHoje.push("Gasto de hoje: " + b.n + " (" + R(b.a) + ")"); 
      }
      else if (b.t !== "s" && Math.min(b.d||1, c.N) === hojeD && !S.paid[S.ym + b.id]) avisosHoje.push("Conta a vencer hoje: " + b.n + " (" + R(b.a) + ")");
    });
    XS().forEach(function(x){
      if (x.d === hojeD) avisosHoje.push("Renda a cair hoje: " + x.n + " (" + R(x.a) + ")");
    });
    for (var off = 1; off <= 3; off++) {
      var dd2 = hojeD + off; if (dd2 > c.N) break;
      c.L.forEach(function(b){
        if (b.t === "dd") {
          if (b.on[dd2] && !S.paid[S.ym + b.id + "d" + dd2]) avisosHoje.push((off === 1 ? "Amanhã" : "Em " + off + " dias") + ": " + b.n + " (" + R(b.a) + ")");
        } else if (b.t !== "s" && Math.min(b.d || 1, c.N) === dd2 && !S.paid[S.ym + b.id]) {
          avisosHoje.push((off === 1 ? "Amanhã" : "Em " + off + " dias") + ": " + b.n + " vence (" + R(b.a) + ")");
        }
      });
    }
    LASTAV = avisosHoje.slice();
    var dh = c.days[hojeD - 1];
    if (dh && dh.sh > 0.005 && !(S.au || {})[S.ym + "d" + hojeD]) avisosHoje.push("Preciso da sua permissão pra tirar " + R(dh.sh) + " da sobra (veja abaixo)");
    if (avisosHoje.length > 0) {
      h += '<div class="alert-box">🔔 <b>Avisos:</b><br>' + avisosHoje.join("<br>") + '</div>';
    }
  }

  h += "<!--BAN-->";
  var rs = RS(c), pg = rs.pg, en = rs.en, nd = rs.nd, tT = rs.tT, iT = rs.iT, mc = mao(S.ym), fl = Math.max(0, tT - pg);
  var sobraEmMaosLiquida = mc + en - pg;

  h += '<div class="cards">' +
       '<div class="cd"><small>Entra no mês</small><b>' + R(iT) + '</b></div>' +
       '<div class="cd"><small>Contas do mês</small><b>' + R(tT) + '</b></div>' +
       '<div class="cd"><small>Já paguei</small><b style="color:var(--ok)">' + R(pg) + '</b></div>' +
       '<div class="cd"><small>Falta pagar</small><b style="color:var(--bad)">' + R(fl) + '</b></div>' +
       '<div class="cd"><small>Entrou até agora</small><b>' + R(en) + '</b></div>' +
       '<div class="cd"><small>Sobra em mãos</small><b style="color:' + (sobraEmMaosLiquida < -0.005 ? "var(--bad)" : "var(--v)") + '">' + R(sobraEmMaosLiquida) + '</b></div>' +
       '</div>' +
       '<div class="bar"><i style="width:' + (tT > 0 ? Math.min(100, Math.round(pg / tT * 100)) : 0) + '%"></i></div>' +
       '<div class="note" style="margin-top:0">' + (tT > 0 ? Math.min(100, Math.round(pg / tT * 100)) : 0) + '% das contas do mês já pagas</div>' +
       '<div class="note">Previsão de sobra no fim do mês: <b>' + R(mc + iT - tT) + '</b>' +
       (ic("tipoRenda") === "diaria" ? ' · ' + nd + ' de ' + c.w + ' diárias marcadas' : '') +
       (Math.abs(mc) > 0.005 ? '<br>Inclui ' + R(mc) + ' que sobrou dos meses anteriores.' : '') + '</div>';

  if (ic("tipoRenda") === "diaria") {
    h += '<div class="big">Em cada diária de ' + R(ic("dia")) + ': separe <b>' + R(c.g) + '</b> pro pote das contas e fique com <b>' + R(ic("dia") - c.g) + '</b> pra você.<small style="display:block;color:var(--mut);font-size:12px;margin-top:4px">Já inclui 20% de folga pro mês que vem.' +
         (c.gAdj && !c.rd ? '<br>Ajustei de ' + R(c.g0) + ' pra ' + R(c.g) + ' porque ' + c.missN + ' diária(s) que já passaram não estão marcadas como recebidas. Marque as que você recebeu.' : '') +
         '</small></div>';
  } else if (ic("tipoRenda") === "quinzena") {
    h += '<div class="big">Renda Quinzenal: Cada quinzena entra <b>' + R(ic("valQuinzena")) + '</b> (dias ' + ic("diaQ1") + ' e ' + ic("diaQ2") + ').</div>';
  } else if (ic("tipoRenda") === "mes") {
    h += '<div class="big">Salário Mensal: Entra <b>' + R(ic("valMes")) + '</b> no dia ' + ic("diaMes") + '.</div>';
  }

  if (c.seps && c.seps.length) {
    c.seps.forEach(function(x){
      h += '<div class="note">Dia ' + x.d + ': ao receber ' + R(x.amt) + ', separe <b>' + R(x.sep) + '</b> pro pote e fique com <b>' + R(x.keep) + '</b>.</div>';
    });
  }

  var ban = "", td1 = isCurrentMonth ? td.getDate() : 1,
      fut = (c.days0 || []).filter(function(x){ return x.sh > 0.005 && x.d >= td1; }),
      pas = (c.days0 || []).filter(function(x){ return x.sh > 0.005 && x.d < td1; }),
      futTot = fut.reduce(function(t, x){ return t + x.sh; }, 0),
      futMin = (c.days0 || []).filter(function(x){ return x.d >= td1; }).reduce(function(m, x){ return Math.min(m, x.mim); }, Infinity),
      primT = fut.length ? fut[0].shn.join(" + ") + ", dia " + fut[0].d : "",
      dica = pas.length ? '<br><small>Teve um aperto antes de hoje (dia ' + pas[0].d + '). Se você já deu um jeito, diga logo abaixo quanto tem hoje que eu refaço o plano.</small>' : '';
  if (fut.length) {
    if (futMin < -0.005) {
      ban += '<div class="warn"><b>🚨 Vai faltar dinheiro.</b> Mesmo usando a sua sobra, não chega. O primeiro aperto é <b>' + primT + '</b>. De hoje em diante faltam <b>' + R(futTot) + '</b> no pote. Mude a data de uma conta ou procure uma renda extra pra esse período.' + dica + '</div>';
    } else {
      ban += '<div class="alert-box">⚠️ <b>Vai precisar tirar da sobra.</b> Mesmo separando o máximo, o pote fica curto. O primeiro aperto é <b>' + primT + '</b> e de hoje em diante saem <b>' + R(futTot) + '</b> da sua sobra. Você tem esse dinheiro: no fim do mês ainda ficam <b>' + R(c.endMimAll) + '</b> livres pra você. Eu só uso se você autorizar.' + dica + '</div>';
    }
  } else if (pas.length) {
    ban += '<div class="card" style="border-color:var(--v)">ℹ️ <b>Daqui pra frente os vencimentos estão cobertos.</b> Pelo que está marcado, o pote ficou curto no dia ' + pas[0].d + ' (já passou). Marque as diárias que você recebeu ou diga logo abaixo quanto tem hoje, que eu refaço o plano.</div>';
  } else {
    ban += '<div class="okb">✅ <b>O pote cobre tudo.</b> Todos os vencimentos do mês estão garantidos só com o que você separa, sem tirar nada da sobra. No fim do mês ficam <b>' + R(c.endMim) + '</b> livres pra você' + (c.endPote > 0.005 ? ' e ' + R(c.endPote) + ' de folga no pote pro mês que vem' : '') + '.</div>';
  }
  var nx = (c.bl || []).filter(function(q){ return !S.paid[S.ym + q.id] && (!isCurrentMonth || q.d >= td.getDate()); })[0];
  if (nx) ban += '<div class="note" style="margin-top:-4px">Próximo vencimento: <b>' + nx.n + '</b> · dia ' + nx.d + ' · ' + R(nx.a) + ' · o pote terá ' + R(nx.before) + '</div>';
  var spend = "";
  if (isCurrentMonth) {
    try {
      var hD = td.getDate(), dl = Math.max(1, c.N - hD + 1),
          dT = (c.days || [])[hD - 1],
          gpH = +((S.gp || {})[S.ym + "d" + hD]) || 0,
          livres = c.endMim,
          budget = (livres + gpH) / dl,
          rest = budget - gpH,
          mimHoje = dT ? dT.mim : 0,
          pend0 = 0, rlx = (S.real || {})[S.ym], realHoje = !!(c.rd && c.rd === hD && rlx && rlx.mim != null);
      if (!realHoje) {
        if (ic("tipoRenda") === "diaria" && wdOn(hD) && !S.paid[S.ym + "d" + hD]) pend0 += Math.max(0, ic("dia") - c.g);
        (c.seps || []).forEach(function(x){ if (x.d === hD && x.id && !S.paid[S.ym + x.id]) pend0 += x.keep; });
      }
      var emMaos = Math.max(0, mimHoje - pend0),
          pode = Math.max(0, Math.min(rest, emMaos)),
          podeInt = Math.floor(pode + 0.0001),
          cor = podeInt <= 0 ? "var(--bad)" : (emMaos + 0.005 < rest ? "#d97706" : "var(--ok)"),
          rec = ic("tipoRenda") === "diaria" ? "a diária de hoje" : "o recebimento de hoje",
          txt;
      if (livres < 0.005) {
        txt = livres < -0.005
          ? (gpH > 0.005 ? 'Com o que você já registrou de gasto hoje, <b>faltam ' + R(-livres) + '</b> pra fechar o mês. O melhor é não gastar mais do que é pra você hoje.' : 'Contando tudo que ainda vai pagar até o fim do mês, <b>faltam ' + R(-livres) + '</b> mesmo usando o que é pra você. O melhor é não gastar do que é pra você hoje.')
          : 'Contando tudo que ainda vai pagar até o fim do mês, <b>não sobra nada livre</b> pra você. O melhor é não gastar do que é pra você hoje.';
      } else {
        txt = 'Contando tudo que ainda vai pagar até o fim do mês, sobram <b>' + R(livres) + '</b> livres pra você em ' + dl + (dl === 1 ? ' dia' : ' dias') + ': dá <b>' + R(budget) + '</b> por dia.';
        if (gpH > 0.005) txt += '<br>Hoje você já registrou ' + R(gpH) + ' de gasto' + (rest > 0.005 ? ': ainda restam ' + R(rest) + ' do dia.' : ': o valor do dia já foi usado.');
        if (emMaos + 0.005 < rest) txt += '<br>Em mãos tem só <b>' + R(emMaos) + '</b> agora' + (pend0 > 0.005 ? ': marque ' + rec + ' como recebida que libera mais.' : '.');
      }
      var obs = (S.real || {})[S.ym]
        ? 'ℹ️ Já considero o que você informou em "Acertar com a realidade". Se o seu dinheiro mudou de novo, atualize logo abaixo.'
        : '⚠️ Esse valor supõe que você ainda não gastou do que é pra você neste mês, além do que registrou aqui. Se já gastou, diga quanto tem em "Acertar com a realidade" logo abaixo que eu corrijo.';
      spend = '<div class="card fld" style="border:2px solid ' + cor + '"><b style="font-size:17px">💸 Quanto posso gastar hoje</b>' +
              '<div style="font-size:38px;font-weight:800;color:' + cor + ';margin:8px 0">R$ ' + podeInt + '</div>' +
              '<div class="note" style="margin:4px 0 6px;font-size:15px">' + txt + '</div>' +
              '<div class="note" style="margin:6px 0;font-size:12px">' + obs + '</div>' +
              '<label>Gastei hoje do que é pra mim (R$)</label>' + inp("g", hD, "g", gpH, "number") + '</div>';
      LASTAV.unshift("Hoje você pode gastar " + R(podeInt));
    } catch (e) { spend = ""; }
  }
  var rl2 = (S.real || {})[S.ym], snap = "";
  if (isCurrentMonth) {
    snap = '<div class="card fld"><b>🔄 Acertar com a realidade</b><div class="note" style="margin:4px 0 6px">Se o dinheiro que você tem agora é diferente do plano, diga quanto tem e eu refaço as contas daqui pra frente.</div>' +
           '<div class="g2"><div><label>Tenho no pote agora (R$)</label>' + inp("r","0","pote", rl2 && rl2.pote != null ? rl2.pote : "", "number") + '</div>' +
           '<div><label>Tenho pra mim agora (R$)</label>' + inp("r","0","mim", rl2 && rl2.mim != null ? rl2.mim : "", "number") + '</div></div>' +
           (rl2 ? '<div class="note">Plano refeito a partir do dia ' + rl2.d + ' com o que você informou.</div><button class="del" data-a="rclr" style="margin-top:0">Voltar ao plano original</button>' : '') + '</div>';
  }

  var permH = "", pend = [], decided = [], pendTot = 0;
  (c.days || []).forEach(function(x){
    if (x.sh < 0.005) return;
    if (isCurrentMonth && x.d < td.getDate()) return;
    var st = (S.au || {})[S.ym + "d" + x.d];
    if (st) decided.push({ x: x, st: st }); else { pend.push({ x: x, st: st }); pendTot += x.sh; }
  });
  function permCard(o) {
    var x = o.x, m0 = c.days0[x.d - 1].mim, st = o.st, hoje = isCurrentMonth && x.d === td.getDate(),
        cor = st === "y" ? "var(--ok)" : (st === "n" ? "var(--bad)" : "#d97706"),
        sobra = m0 < -0.005 ? '<br><span style="color:var(--bad)">🚨 Mesmo com a sua sobra, ainda faltariam ' + R(-m0) + '.</span>' : '<br>Depois disso sua sobra ficaria em <b>' + R(m0) + '</b>.',
        q = '<div class="note" style="margin:4px 0 8px">O pote não tem o suficiente. Posso tirar <b>' + R(x.sh) + '</b> da sua sobra ("pra mim")?' + sobra + '</div>',
        bt;
    if (!st) bt = '<div class="pb"><button class="yes" data-a="au" data-i="' + x.d + '" data-v="y">✅ Autorizar</button><button class="no" data-a="au" data-i="' + x.d + '" data-v="n">❌ Não autorizar</button></div>';
    else bt = '<div class="pb" style="align-items:center"><span class="grow" style="color:' + cor + ';font-weight:700;font-size:14px">' + (st === "y" ? "✅ Autorizado: " + R(x.sh) + " sai da sobra" : "🚫 Não autorizado: nada sai da sobra") + '</span><button data-a="au" data-i="' + x.d + '" data-v="" style="flex:none;padding:8px 12px">Desfazer</button></div>';
    return '<div class="card perm" style="border-color:' + cor + '"><b>' + (hoje ? "HOJE · " : "") + WN[new Date(c.Y, c.M-1, x.d).getDay()] + ' ' + x.d + '</b> · ' + x.shn.join(" + ") + q + bt + '</div>';
  }
  if (pend.length || decided.length) {
    permH += '<div class="note"><b>🔐 Permissão pra tirar da sobra</b><br>Quando o pote não dá, eu peço antes de usar o seu dinheiro "pra mim". Se você não autorizar, nada sai da sua sobra e a conta fica sem cobertura.</div>';
    if (pend.length > 1) permH += '<button class="add" data-a="auall" data-l="' + pend.map(function(o){ return o.x.d; }).join(",") + '" style="margin:0 0 8px">✅ Autorizar todos (' + R(pendTot) + ')</button>';
    pend.concat(decided).forEach(function(o){ permH += permCard(o); });
  }

  var venc = [];
  (c.bl || []).forEach(function(b){
    venc.push({ d: b.d, id: b.id, o: 0, st: (S.au || {})[S.ym + "d" + b.d], t: b.n + (b.t === "dd" ? " (Diária)" : ""), a: b.a, done: S.paid[S.ym + b.id], short: b.short, no: b.short >= 0.005 && b.mimAfter < -0.005,
      ok: "Dá: o pote terá " + R(b.before) + ".",
      amb: "Tire " + R(b.short) + " da sobra em mãos: o pote terá só " + R(b.before) + ".",
      red: "Não dá: o pote terá " + R(b.before) + ", faltam " + R(b.short) + " e a sobra em mãos não chega." });
  });
  (c.weeks || []).forEach(function(k){
    venc.push({ d: k.d, o: 1, t: c.wnames + " · semana " + (k.d0 == k.d ? "dia " + k.d : "dias " + k.d0 + " a " + k.d), a: k.amt, done: false, short: k.sh, no: k.sh >= 0.005 && k.mn < -0.005,
      ok: "Dá: pagando " + R(k.amt) + " na semana, o pote fica com " + R(k.pote) + ".",
      amb: "Tire " + R(k.sh) + " da sobra em mãos pra fechar a semana.",
      red: "Não dá: faltam " + R(k.sh) + " pra fechar a semana e a sobra em mãos não chega." });
  });
  venc.sort(function(a, b){ return a.d - b.d || a.o - b.o; });
  if (venc.length) {
    var nProb = venc.filter(function(v){ return v.short >= 0.005 && !(isCurrentMonth && v.d < td.getDate()); }).length;
    h += '<button class="add" data-a="tvenc" style="margin:0 0 10px;text-align:left">' + (VOPEN ? "▾ Esconder" : "▸ Ver") + ' vencimentos: o que dá e o que não dá' + (nProb ? ' · ⚠️ ' + nProb + ' pedem atenção' : ' · ✅ tudo coberto') + '</button>';
    if (VOPEN) venc.forEach(function(b){
      var ok = b.short < 0.005, no = b.no,
          cor = ok ? "var(--ok)" : (no ? "var(--bad)" : "#d97706"),
          ate = (isCurrentMonth && b.d >= td.getDate()) ? " · " + (b.d == td.getDate() ? "hoje" : "em " + (b.d - td.getDate()) + " dias") : "",
          msg = ok ? "✅ " + b.ok : (no ? "🚨 " + b.red : "⚠️ " + b.amb);
      if (!ok && b.o === 0 && b.st === "n") { cor = "var(--bad)"; msg = "🚫 Sem sua permissão pra tirar da sobra: faltam " + R(b.short) + "."; }
      else if (!ok && b.o === 0 && !b.st && !no) msg += " Aguardando sua permissão.";
      if (isCurrentMonth && b.d < td.getDate()) {
        if (b.o === 1) return;
        cor = b.done ? "var(--ok)" : "var(--mut)";
        msg = b.done ? "✓ Já paga" : "Já venceu: marque como paga abaixo quando pagar.";
      }
      h += '<div class="row' + (b.done ? " done" : "") + '" style="cursor:default;align-items:flex-start;border-left:4px solid ' + cor + '"><span class="grow"><b>' + WN[new Date(c.Y, c.M-1, b.d).getDay()] + ' ' + b.d + ' · ' + b.t + '</b>' + ate +
           '<small style="color:' + cor + '">' + msg + '</small></span><span class="amt">' + R(b.a) + '</span></div>';
    });
  }

  var hj = isCurrentMonth && wdOn(td.getDate());
  if (hj && ic("tipoRenda") === "diaria" && ic("dia") > 0) {
    h += '<div class="big">Hoje (' + WN[td.getDay()] + ' ' + td.getDate() + '): ao receber a diária, separe <b>' + R(c.g) + '</b> pro pote das contas' + (c.wc[td.getDate()] > 0 ? ' (já inclui ' + R(c.wc[td.getDate()]) + ' da conta semanal)' : '') + ' e fique com <b>' + R(ic("dia") - c.g) + '</b>.</div>';
  }

  var cy = carry(S.ym);
  h += '<button class="add" data-a="carry" style="margin:0 0 10px">' +
       (ic("carry") ? "✓ Somando o que sobrou do mês anterior (toque pra desligar)" : "Somar o que sobrou do mês anterior (desligado)") +
       '</button>';
  
  h += ic("carry") ? '<div class="note">Veio do mês anterior: pote ' + R(cy.p) + ' · pra mim ' + R(cy.m) + '</div>'
              : '<div class="card fld"><label>Começar o mês com este valor no pote (R$)</label>' + inp("c","0","ini",S.ini[S.ym]||0,"number") + '</div>';

  return h.replace("<!--BAN-->", ban + spend + permH + snap) + '<button class="add" data-a="tab" data-i="2" style="background:var(--c);color:var(--bg);border-color:var(--c)">✅ Marcar diárias e pagamentos →</button>';
}

function mkGrid(c, pre, on) {
  var h = '<div class="mk">', first = new Date(c.Y, c.M - 1, 1).getDay(), td = new Date(),
      cur = td.getFullYear() == c.Y && (td.getMonth() + 1) == c.M, i, q, dn;
  WN.forEach(function(n){ h += '<div class="mh">' + n + '</div>'; });
  for (i = 0; i < first; i++) h += '<div></div>';
  for (q = 1; q <= c.N; q++) {
    if (!on(q)) { h += '<div class="off">' + q + '</div>'; continue; }
    dn = S.paid[S.ym + pre + q];
    h += '<button class="' + (dn ? "on" : "") + (cur && td.getDate() === q ? " hj" : "") + '" data-a="tog" data-i="' + pre + q + '">' + q + '<small>' + (dn ? "✓" : "") + '</small></button>';
  }
  return h + '</div>';
}

function vMarcar() {
  var c = calc(), rs = RS(c), tT = rs.tT, pg = rs.pg, pct = tT > 0 ? Math.min(100, Math.round(pg / tT * 100)) : 0,
      h = navH();
  h += '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
       '<div class="note" style="margin-top:0">Paguei <b>' + R(pg) + '</b> · falta <b>' + R(Math.max(0, tT - pg)) + '</b> (' + pct + '% das contas)</div>';

  if (ic("tipoRenda") === "diaria" && ic("dia") > 0) {
    var tot = 0, ok = 0;
    for (var q = 1; q <= c.N; q++) if (wdOn(q)) { tot++; if (S.paid[S.ym + "d" + q]) ok++; }
    h += '<div class="note"><b>Diárias recebidas</b> · ' + ok + ' de ' + tot + '<br>Em cada uma separe <b>' + R(c.g) + '</b> pro pote e fique com <b>' + R(ic("dia") - c.g) + '</b>. Toque no dia pra marcar.</div>';
    h += mkGrid(c, "d", wdOn);
  } else if (ic("tipoRenda") === "quinzena" && ic("valQuinzena") > 0) {
    h += '<div class="note"><b>Recebimentos da Quinzena</b></div>';
    [["q1", "1ª Quinzena (Dia " + ic("diaQ1") + ")"], ["q2", "2ª Quinzena (Dia " + ic("diaQ2") + ")"]].forEach(function(z){
      var d1 = S.paid[S.ym + z[0]];

  h += '<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px;">' +
       '<span>Pote no fim do dia: <b style="color:var(--c)">' + R(selInfo.pote) + '</b></span>' +
       '<span>Pra você: <b style="color:var(--v)">' + R(selInfo.mim) + '</b></span>' +
       '</div>';
  h += '</div>';
  
  return h;
}

function draw() {
  CC = {}; MC = {};
  document.getElementById("tabs").innerHTML = ["Renda","Mês","Marcar","Calendário","Saldo","Contas"].map(function(n,i){
    return '<button data-a="tab" data-i="'+i+'" class="'+(i==tab?"on":"")+'">'+n+'</button>';
  }).join("");
  document.getElementById("view").innerHTML = [vRenda, vMes, vMarcar, vCalendario, vSaldo, vContas][tab]();
  
  var btnNotif = document.getElementById("btn-notif");

document.addEventListener("change", function(e){
  var t = e.target, sc = t.dataset.s; if (!sc) return;
  var f = t.dataset.f, v = t.value;
  if (sc == "g") { S.gp = S.gp || {}; S.gp[S.ym + "d" + t.dataset.i] = parseFloat(v) || 0; }
  else if (sc == "r") {
    S.real = S.real || {};
    var rr = S.real[S.ym] || (S.real[S.ym] = { d: 1, pote: null, mim: null });
    rr.d = new Date().getDate();
    if (f == "pote") rr.pote = v === "" ? null : (parseFloat(v) || 0);
    else rr.mim = v === "" ? null : (parseFloat(v) || 0);
    if (rr.pote === null && rr.mim === null) delete S.real[S.ym];
  }
  else if (sc == "c") {
    if (f == "tipoRenda") setC("tipoRenda", v);
    else if (f == "ini") S.ini[S.ym] = parseFloat(v) || 0;
    else if (f == "dia") setC("dia", parseFloat(v) || 0);
    else if (f == "valQuinzena") setC("valQuinzena", parseFloat(v) || 0);
    else if (f == "diaQ1") setC("diaQ1", parseInt(v) || 1);
    else if (f == "diaQ2") setC("diaQ2", parseInt(v) || 15);
    else if (f == "valMes") setC("valMes", parseFloat(v) || 0);
    else if (f == "diaMes") setC("diaMes", parseInt(v) || 5);
  }
  else {
    var o = (sc == "b" ? S.bills : S.ex).filter(function(x){ return x.id == t.dataset.i; })[0];
    if (o) {
      if (f == "f") { if (v && v < S.ym) v = S.ym; o.f = v; }
      else {
        o.v = o.v || {}; o.v[S.ym] = o.v[S.ym] || {};
        o.v[S.ym][f] = (f == "a" || f == "d") ? (parseFloat(v) || 0) : v;
        if (f == "t" && v == "m" && !o.d) o.d = 1;
        if (f == "t" && v == "dd") o.v[S.ym].wd = [];
      }
    }
  }
  save(); draw();
});

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-a]"); if (!t) return;
  var a = t.dataset.a, i = t.dataset.i;
  if (a == "tab") { tab = +i; window.scrollTo(0, 0); }
  else if (a == "pm" || a == "nm") {
    var p = S.ym.split("-"), d = new Date(+p[0], +p[1] - 1 + (a == "nm" ? 1 : -1), 1);
    S.ym = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
    selDay = 1;
  }
  else if (a == "selday") selDay = +i;
  else if (a == "tvenc") VOPEN = !VOPEN;
  else if (a == "tog") { var k = S.ym + i; S.paid[k] = !S.paid[k]; }
  else if (a == "wd") { var cur = ic("dias").slice(), x = cur.indexOf(+i); if (x < 0) cur.push(+i); else cur.splice(x, 1); setC("dias", cur); }
  else if (a == "rclr") { delete (S.real || {})[S.ym]; }
  else if (a == "bkgen") { var bk = document.getElementById("bk"); if (bk) { bk.value = JSON.stringify(S); bk.focus(); bk.select(); try { document.execCommand("copy"); } catch(e2){} } return; }
  else if (a == "bkrst") {
    var bt2 = document.getElementById("bk"), nS = null;
    try { nS = JSON.parse(bt2 ? bt2.value : ""); } catch(e3){}
    if (!nS || !nS.bills || !nS.ym) { alert("Cole primeiro o texto do backup na caixa."); return; }
    S = nS; fix(); S.start = S.start || S.ym; save();
  }
  else if (a == "wkd") {
    S.dw = S.dw || {};
    var wk = S.ym + "d" + i, ws = wkState(+i), wp = S.ym.split("-"), wpat = ic("dias").indexOf(new Date(+wp[0], +wp[1]-1, +i).getDay()) >= 0;
    if (wpat) {
      if (ws === "n") { delete S.dw[wk]; delete S.paid[wk]; }
      else if (ws === "y") { S.dw[wk] = "n"; delete S.paid[wk]; }
      else S.paid[wk] = true;
    } else {
      if (ws === "off") { S.dw[wk] = "y"; S.paid[wk] = true; }
      else { delete S.dw[wk]; delete S.paid[wk]; }
    }
  }
  else if (a == "wkall") {
    var tdy = new Date(), wq;
    for (wq = 1; wq <= tdy.getDate(); wq++) if (wkState(wq) === "p") S.paid[S.ym + "d" + wq] = true;
  }
  else if (a == "au") { S.au = S.au || {}; var ak = S.ym + "d" + i; if (t.dataset.v) S.au[ak] = t.dataset.v; else delete S.au[ak]; }
  else if (a == "auall") { S.au = S.au || {}; (t.dataset.l || "").split(",").forEach(function(dd){ if (dd) S.au[S.ym + "d" + dd] = "y"; }); }
  else if (a == "carry") setC("carry", !ic("carry"));
  else if (a == "bdt") {
    var bo3 = S.bills.filter(function(z){ return z.id == i; })[0];
    if (bo3) {
      var e3 = eff(bo3, S.ym), dn = +t.dataset.w;
      if (e3.t === "m") {
        bo3.v = bo3.v || {}; bo3.v[S.ym] = bo3.v[S.ym] || {}; bo3.v[S.ym].d = dn;
      } else {
        var lst = onList(billPlan(e3, S.ym, ic("dias"), 0).on), ix = lst.indexOf(dn);
        if (ix < 0) lst.push(dn); else if (!(e3.t === "s" && lst.length === 1)) lst.splice(ix, 1);
        lst.sort(function(x, y){ return x - y; });
        bo3.dm = bo3.dm || {}; bo3.dm[S.ym] = lst;
      }
    }
  }
  else if (a == "bdtclr") {
    var bo4 = S.bills.filter(function(z){ return z.id == i; })[0];
    if (bo4 && bo4.dm) delete bo4.dm[S.ym];
  }
  else if (a == "bwd") {
    var bo = S.bills.filter(function(z){ return z.id == i; })[0];
    if (bo) {
      var bo2 = eff(bo, S.ym),
          cur2 = (bo2.t === "s" ? ((bo2.wd && bo2.wd.length) ? bo2.wd : ic("dias")) : (bo2.wd || [1,2,3,4,5])).slice(),
          w3 = +t.dataset.w, x3 = cur2.indexOf(w3);
      if (x3 < 0) cur2.push(w3); else if (!(bo2.t === "s" && cur2.length === 1)) cur2.splice(x3, 1);
      if (bo.dm) delete bo.dm[S.ym];
      bo.v = bo.v || {}; bo.v[S.ym] = bo.v[S.ym] || {}; bo.v[S.ym].wd = cur2;
    }
  }
  else if (a == "notif") {
    if (window.Notification) {
      Notification.requestPermission().then(function(perm){
        if (perm === "granted") {
          new Notification("Planejamento Financeiro", { body: "Lembretes ativados com sucesso!" });
          draw();
        } else {
          alert("Permissão de notificação negada pelo navegador.");
        }
      });
    } else {
      alert("Este navegador não suporta notificações.");
    }
  }
  else if (a == "addb") S.bills.push({ id: "b" + Date.now(), n: "Nova conta", a: 0, d: 1, t: "m", i: S.ym, f: "", v: {} });
  else if (a == "addx") S.ex.push({ id: "x" + Date.now(), n: "Nova renda", a: 0, d: 1, i: S.ym, f: "", v: {} });
  else if (a == "delb" || a == "delx") {
    var key = a == "delb" ? "bills" : "ex", o = S[key].filter(function(z){ return z.id == i; })[0];
    if (o) {
      if (!o.i || o.i >= S.ym) S[key] = S[key].filter(function(z){ return z.id != i; });
      else o.f = prevYM(S.ym);
    }
  }
  save(); draw();
});
